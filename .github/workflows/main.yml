// Simulated Sensor Data Collection System
// Sensors: Temperature, Humidity, Motion
// Board: Arduino UNO

float temperature;
float humidity;
int motion;

void setup() {
  Serial.begin(9600);

  // Random generator seed
  randomSeed(analogRead(A0));

  Serial.println("=== Sensor Data Collection Started ===");
  Serial.println("Time(s), Temperature(C), Humidity(%), Motion");
}

void loop() {

  // Simulate Temperature (20°C to 40°C)
  temperature = random(200, 401) / 10.0;

  // Simulate Humidity (40% to 90%)
  humidity = random(400, 901) / 10.0;

  // Simulate Motion (0 = No Motion, 1 = Motion)
  motion = random(0, 2);

  // Display values
  Serial.print(millis() / 1000);
  Serial.print(", ");

  Serial.print(temperature);
  Serial.print(" C, ");

  Serial.print(humidity);
  Serial.print(" %, ");

  if (motion == 1)
    Serial.println("Motion Detected");
  else
    Serial.println("No Motion");

  // Delay for new sensor reading
  delay(2000);
}
